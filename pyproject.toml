[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "insidellms"
version = "0.1.0"
description = "Mechanistic Interpretability of Domain Routing in LLMs"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
    "numpy",
    "pandas",
    "matplotlib",
    "h5py",
    "scikit-learn",
    "pyyaml",
    "tqdm",
]

[tool.setuptools.packages.find]
include = ["utils*", "experiments*"]
